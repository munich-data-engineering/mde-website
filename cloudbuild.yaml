steps:
  - name: "node:22-slim"
    id: install
    entrypoint: npm
    args: ["ci"]
    dir: "dist/mde_website/server"

  - name: "gcr.io/cloud-builders/docker"
    id: build
    args:
      - build
      - "-t"
      - "gcr/${PROJECT_ID}/mde-website-ssr:${COMMIT_SHA}"
      - "-f"
      - "Dockerfile.ssr"
      - "."
    dir: "dist/mde_website/server"

  - name: "gcr.io/cloud-builders/docker"
    id: push
    args:
      - push
      - "gcr/${PROJECT_ID}/mde-website-ssr:${COMMIT_SHA}"

  - name: "gcr.io/cloud-builders/gcloud"
    id: deploy
    entrypoint: gcloud
    args:
      - "run"
      - "deploy"
      - "mde-website-ssr"
      - "--image"
      - "gcr/${PROJECT_ID}/mde-website-ssr:${COMMIT_SHA}"
      - "--region"
      - "us-central1"
      - "--platform"
      - "managed"
      - "--allow-unauthenticated"
      - "--port"
      - "8080"

images:
  - "gcr/${PROJECT_ID}/mde-website-ssr:${COMMIT_SHA}"
